<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" width="100%" role="img" aria-label="WorkMate 企业员工 AI 助手演示动画">
  <defs>
    <!-- 打字 reveal：每轮 dur=9.5s，begin 偏移后重复，前段打完保持 -->
    <clipPath id="clip-user">
      <rect x="0" y="0" width="0" height="60">
        <animate attributeName="width" values="0;340;340" keyTimes="0;0.21;1" dur="9.5s" begin="0.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.3 0 0.8 1;0 0 1 1"/>
      </rect>
    </clipPath>
    <clipPath id="clip-tool">
      <rect x="0" y="0" width="0" height="40">
        <animate attributeName="width" values="0;330;330" keyTimes="0;0.12;1" dur="9.5s" begin="2.7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="clip-msg1">
      <rect x="0" y="0" width="0" height="24">
        <animate attributeName="width" values="0;215;215" keyTimes="0;0.11;1" dur="9.5s" begin="3.6s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="clip-msg2">
      <rect x="0" y="0" width="0" height="24">
        <animate attributeName="width" values="0;300;300" keyTimes="0;0.12;1" dur="9.5s" begin="4.8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- 背景光晕 -->
  <circle cx="460" cy="270" r="260" fill="#eef2ff" opacity="0.5"/>

  <!-- ===== 卡片主体 ===== -->
  <g>
    <rect x="130" y="70" width="660" height="430" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="130" y1="112" x2="790" y2="112" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="158" cy="91" r="5.5" fill="#f87171"/>
    <circle cx="176" cy="91" r="5.5" fill="#fbbf24"/>
    <circle cx="194" cy="91" r="5.5" fill="#34d399"/>
    <text x="216" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#64748b">workmate.ai / 助手</text>

    <!-- ===== 用户消息（右侧深色气泡），循环淡入淡出 ===== -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.82;0.88" dur="9.5s" begin="0s" repeatCount="indefinite"/>
      <rect x="470" y="136" width="300" height="52" rx="12" fill="#0f172a"/>
      <text x="486" y="160" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#f8fafc" clip-path="url(#clip-user)">我最近三个月的报销记录和总额是多少？</text>
      <rect x="486" y="164" width="7" height="15" fill="#818cf8">
        <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.02;0.21;0.22" dur="9.5s" begin="0.4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- ===== 工具调用 pill ===== -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.01;0.54;0.82" dur="9.5s" begin="2.7s" repeatCount="indefinite"/>
      <rect x="170" y="214" width="322" height="38" rx="19" fill="#f5f3ff" stroke="#c7d2fe" stroke-width="1.2"/>
      <circle cx="192" cy="233" r="8" fill="#818cf8" opacity="0.25"/>
      <path d="M188 233 h8 M192 229 v8" stroke="#6366f1" stroke-width="1.6" stroke-linecap="round"/>
      <text x="208" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#4338ca" clip-path="url(#clip-tool)">mcp_execute_query · reimbursements · 3 rows</text>
    </g>

    <!-- ===== 助手消息（左侧浅色气泡） ===== -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.01;0.46;0.84" dur="9.5s" begin="3.6s" repeatCount="indefinite"/>
      <rect x="170" y="282" width="410" height="96" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="190" cy="300" r="8" fill="#818cf8"/>
      <path d="M186 300 h8 M190 296 v8" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
      <text x="208" y="304" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#94a3b8">WorkMate</text>
      <text x="186" y="334" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#0f172a" clip-path="url(#clip-msg1)">你最近三个月共 3 笔报销，</text>
      <text x="186" y="358" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#0f172a" clip-path="url(#clip-msg2)">合计 1,240 元，2 笔已到账、1 笔审批中。</text>
      <rect x="486" y="344" width="7" height="15" fill="#818cf8">
        <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.02;0.22;0.23" dur="9.5s" begin="4.8s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- ===== 输入框 ===== -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.01;0.14;0.84" dur="9.5s" begin="6.5s" repeatCount="indefinite"/>
      <rect x="170" y="410" width="600" height="42" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <circle cx="192" cy="431" r="6" fill="#818cf8" opacity="0.3"/>
      <text x="208" y="436" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#94a3b8">询问报销、请假或制度…</text>
      <text x="722" y="436" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#94a3b8">⌘ ↵</text>
    </g>
  </g>

  <!-- ===== 浮动标签（卡片四周，上下浮动） ===== -->
  <g>
    <rect x="70" y="150" width="118" height="34" rx="17" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="92" cy="167" r="7" fill="#818cf8" opacity="0.25"/>
    <path d="M89 167 h6 M92 164 v6" stroke="#6366f1" stroke-width="1.4" stroke-linecap="round"/>
    <text x="104" y="171" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#334155">自然语言查数</text>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="5s" repeatCount="indefinite"/>
  </g>

  <g>
    <rect x="728" y="176" width="132" height="34" rx="17" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="748" cy="193" r="7" fill="#34d399" opacity="0.3"/>
    <ellipse cx="748" cy="193" rx="4" ry="5" stroke="#059669" stroke-width="1.4" fill="none"/>
    <text x="762" y="197" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#334155">连接企业数据库</text>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 6; 0 0" dur="6s" repeatCount="indefinite"/>
  </g>

  <g>
    <rect x="120" y="516" width="118" height="34" rx="17" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="142" cy="533" r="7" fill="#fbbf24" opacity="0.35"/>
    <path d="M137 533 l4 -3 l4 3 l-4 3 z" stroke="#d97706" stroke-width="1.3" fill="none"/>
    <text x="154" y="537" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#334155">MCP 工具调用</text>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="6s" repeatCount="indefinite" begin="1s"/>
  </g>

  <g>
    <rect x="688" y="500" width="118" height="34" rx="17" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="708" cy="517" r="7" fill="#f472b6" opacity="0.3"/>
    <path d="M704 519 l3 -4 l3 4 l3 -3" stroke="#db2777" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <text x="722" y="521" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#334155">图表与建议</text>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 6; 0 0" dur="5s" repeatCount="indefinite" begin="0.5s"/>
  </g>
</svg>
